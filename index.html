<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Diary AI 🎨</title>
<style>
body {margin:0; font-family:sans-serif; background:#18191f; color:#eee; display:flex; flex-direction:column; align-items:center;}
#topbar {display:flex; justify-content:center; gap:10px; margin:10px; flex-wrap:wrap;}
button {padding:8px 12px; border:none; border-radius:8px; background:#4a4a6a; color:#fff; cursor:pointer;}
button:hover{background:#606090;}
#palette {margin:10px;}
canvas#mainCanvas {border:1px solid #444; touch-action:none; margin-top:10px;}
#calendar, #gallery {display:none; flex-wrap:wrap; justify-content:center; margin:10px;}
.day, .thumb {width:60px; height:60px; margin:5px; display:flex; align-items:center; justify-content:center; border-radius:8px; cursor:pointer; background:#3a3a5a; color:#fff; font-weight:bold;}
.day.hasData{background:#50a0ff;}
.thumb canvas{width:100%; height:100%; border-radius:8px; object-fit:cover; transition: transform 0.3s;}
.thumb:hover canvas{transform:scale(1.1);}
#zoomView {position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:flex; justify-content:center; align-items:center; display:none;}
#zoomView img{max-width:90%; max-height:90%; border-radius:12px; animation:zoomIn 0.3s;}
@keyframes zoomIn {from{transform:scale(0)} to{transform:scale(1)}}
</style>
</head>
<body>

<h1>Pixel Diary AI 🎨</h1>

<div id="topbar">
    <button id="btnCalendar">📅 Calendar</button>
    <button id="btnGallery">🖼️ Gallery</button>
    <button id="btnAI">🤖 AI Draw</button>
    <button id="btnSave">💾 Save Image</button>
</div>

<input type="color" id="colorPicker" value="#ff0000">
<canvas id="mainCanvas" width="500" height="500"></canvas>

<div id="calendar"></div>
<div id="gallery"></div>
<div id="zoomView"><img src="" alt="zoomed"></div>

<script>
// ======= Globals =======
let canvas = document.getElementById('mainCanvas');
let ctx = canvas.getContext('2d');
let painting = false;
let brushColor = document.getElementById('colorPicker').value;
let gridSize = 20;
let rows = canvas.height / gridSize;
let cols = canvas.width / gridSize;
let currentDate = new Date();
let dataStore = {}; // will load from localStorage

// ======= Color Picker =======
document.getElementById('colorPicker').addEventListener('input',(e)=>{
    brushColor = e.target.value;
});

// ======= Load / Save per day =======
function saveDay(date){
    let key = date.toISOString().slice(0,10);
    localStorage.setItem(key, JSON.stringify(dataStore[key] || []));
}

function loadDay(date){
    let key = date.toISOString().slice(0,10);
    let saved = localStorage.getItem(key);
    dataStore[key] = saved ? JSON.parse(saved) : [];
    redrawCanvas();
}

// ======= Draw Pixel =======
function drawPixel(x,y){
    let r = Math.floor(y / gridSize);
    let c = Math.floor(x / gridSize);
    ctx.fillStyle = brushColor;
    ctx.fillRect(c*gridSize,r*gridSize,gridSize,gridSize);
    let dateKey = currentDate.toISOString().slice(0,10);
    if(!dataStore[dateKey]) dataStore[dateKey]=[];
    dataStore[dateKey].push({r,c,color:brushColor});
}

// ======= Mouse / Touch =======
canvas.addEventListener('mousedown',()=>painting=true);
canvas.addEventListener('mouseup',()=>{painting=false; saveDay(currentDate);});
canvas.addEventListener('mousemove',(e)=>{if(painting){ let rect=canvas.getBoundingClientRect(); drawPixel(e.clientX-rect.left,e.clientY-rect.top); }});
canvas.addEventListener('touchstart',(e)=>{painting=true; let rect=canvas.getBoundingClientRect(); drawPixel(e.touches[0].clientX-rect.left,e.touches[0].clientY-rect.top); e.preventDefault();});
canvas.addEventListener('touchmove',(e)=>{if(painting){ let rect=canvas.getBoundingClientRect(); drawPixel(e.touches[0].clientX-rect.left,e.touches[0].clientY-rect.top); } e.preventDefault();});
canvas.addEventListener('touchend',()=>{painting=false; saveDay(currentDate);});

// ======= Redraw Canvas =======
function redrawCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let key = currentDate.toISOString().slice(0,10);
    if(dataStore[key]){
        dataStore[key].forEach(p=>ctx.fillStyle=p.color, ctx.fillRect(p.c*gridSize,p.r*gridSize,gridSize,gridSize));
    }
}

// ======= Calendar =======
let calDiv = document.getElementById('calendar');
document.getElementById('btnCalendar').onclick=()=>{
    calDiv.innerHTML='';
    calDiv.style.display='flex';
    galleryDiv.style.display='none';
    for(let d=1; d<=31; d++){
        let dayDiv = document.createElement('div');
        dayDiv.className='day';
        let key = currentDate.toISOString().slice(0,8)+d.toString().padStart(2,'0');
        if(localStorage.getItem(key)) dayDiv.classList.add('hasData');
        dayDiv.innerText=d;
        dayDiv.onclick=()=>{
            currentDate.setDate(d);
            loadDay(currentDate);
        }
        calDiv.appendChild(dayDiv);
    }
};

// ======= Gallery =======
let galleryDiv = document.getElementById('gallery');
document.getElementById('btnGallery').onclick=()=>{
    galleryDiv.innerHTML='';
    galleryDiv.style.display='flex';
    calDiv.style.display='none';
    for(let i=0;i<localStorage.length;i++){
        let key = localStorage.key(i);
        if(!/^\d{4}-\d{2}-\d{2}$/.test(key)) continue;
        let thumb = document.createElement('div');
        thumb.className='thumb';
        let imgCanvas = document.createElement('canvas');
        imgCanvas.width=cols*gridSize;
        imgCanvas.height=rows*gridSize;
        let ctx2 = imgCanvas.getContext('2d');
        let saved = JSON.parse(localStorage.getItem(key));
        saved.forEach(p=>ctx2.fillStyle=p.color, ctx2.fillRect(p.c*gridSize,p.r*gridSize,gridSize,gridSize));
        thumb.appendChild(imgCanvas);
        thumb.onclick=()=>{
            let zoom = document.getElementById('zoomView');
            zoom.children[0].src = imgCanvas.toDataURL();
            zoom.style.display='flex';
        }
        galleryDiv.appendChild(thumb);
    }
};
document.getElementById('zoomView').onclick=()=>{document.getElementById('zoomView').style.display='none';}

// ======= Save Image =======
document.getElementById('btnSave').onclick=()=>{
    let name = prompt("اسم الصورة:");
    if(!name) return;
    let link = document.createElement('a');
    link.download = name+".png";
    link.href = canvas.toDataURL();
    link.click();
};

// ======= AI Draw =======
document.getElementById('btnAI').onclick=()=>{
    let key = currentDate.toISOString().slice(0,10);
    if(!dataStore[key]) dataStore[key]=[];
    for(let i=0;i<50;i++){
        let r = Math.floor(Math.random()*rows);
        let c = Math.floor(Math.random()*cols);
        let hue = Math.floor(Math.random()*360);
        let color = `hsl(${hue}, 100%, 50%)`;
        ctx.fillStyle=color;
        ctx.fillRect(c*gridSize,r*gridSize,gridSize,gridSize);
        dataStore[key].push({r,c,color});
    }
    saveDay(currentDate);
};

// ======= Init =======
loadDay(currentDate);
</script>

</body>
</html>
